<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MongolUSA Hub — Demo</title>
<style>
:root{
  --primary:#1B5E43; --primary-dark:#154835; --primary-light:#2E7D5B;
  --accent:#D9A441; --accent-soft:#F6EAD1;
  --surface:#FAFAF7; --card:#FFFFFF; --card-alt:#F2F3EF;
  --ink:#141816; --ink-2:#4C5551; --ink-3:#7C8683;
  --line:#E4E7E3; --line-strong:#CBD1CB;
  --good:#1B7A4B; --good-bg:#E7F3EC;
  --warn:#7E5800; --warn-bg:#F8EFD8;
  --serious:#98470B; --serious-bg:#F9E9DB;
  --critical:#9E2222; --critical-bg:#F8E6E6;
  --info:#20566F; --info-bg:#E6EFF4;
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --sh1:0 1px 2px rgba(16,24,20,.05);
  --sh2:0 2px 10px rgba(16,24,20,.07);
  --sh3:0 10px 30px rgba(16,24,20,.13);
  --fast:140ms; --base:240ms;
  --nav-h:58px;
}
html[data-theme="dark"]{
  --primary:#63C098; --primary-dark:#43A078; --primary-light:#84D2AF;
  --accent:#E4BA6A; --accent-soft:#332C1E;
  --surface:#101312; --card:#191D1B; --card-alt:#222724;
  --ink:#EDF0ED; --ink-2:#B4BCB8; --ink-3:#8B9591;
  --line:#2A302C; --line-strong:#3B433D;
  --good:#71D29E; --good-bg:#152E1E;
  --warn:#E0BA66; --warn-bg:#302811;
  --serious:#E59C63; --serious-bg:#31210F;
  --critical:#E58484; --critical-bg:#311717;
  --info:#82BAD6; --info-bg:#13252D;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 2px 10px rgba(0,0,0,.45); --sh3:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background var(--base),color var(--base);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:640;letter-spacing:-.015em}
h1{font-size:23px} h2{font-size:17px} h3{font-size:15.5px} h4{font-size:13.5px}
p{margin:0 0 var(--s3)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

#demoBanner{
  background:var(--accent-soft); color:#6A4E12;
  border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  font-size:12px; font-weight:600; padding:7px var(--s4); text-align:center;
}
html[data-theme="dark"] #demoBanner{color:var(--accent)}

#appbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:var(--s3);
  padding:var(--s3) var(--s4);
  background:color-mix(in srgb,var(--card) 90%,transparent);
  backdrop-filter:saturate(1.3) blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{font-weight:680;letter-spacing:-.025em;font-size:16px;color:var(--ink)}
.spacer{flex:1}
.txtbtn{
  padding:6px 12px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;
  color:var(--ink-2);border:1px solid var(--line);transition:all var(--fast);white-space:nowrap;
}
.txtbtn:hover{background:var(--card-alt);color:var(--ink)}
.langtoggle{display:flex;background:var(--card-alt);border-radius:var(--r-pill);padding:3px;gap:2px;border:1px solid var(--line)}
.langtoggle button{padding:4px 11px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;color:var(--ink-3);transition:all var(--fast)}
.langtoggle button[aria-pressed="true"]{background:var(--primary);color:#fff}
html[data-theme="dark"] .langtoggle button[aria-pressed="true"]{color:#0D1411}

#citybar{
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);
  background:var(--card);font-size:12.5px;color:var(--ink-2);
}
#citybar b{color:var(--ink);font-weight:640}

#layout{display:flex;min-height:calc(100vh - 120px)}
#rail{display:none}
#main{flex:1;min-width:0;padding:var(--s4);padding-bottom:calc(var(--nav-h) + var(--s6))}
.wrap{max-width:1060px;margin:0 auto}
@media(min-width:600px){
  #rail{
    display:flex;flex-direction:column;gap:2px;width:168px;flex:0 0 168px;
    padding:var(--s5) var(--s3);border-right:1px solid var(--line);background:var(--card);
    position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  }
  .raillink{
    display:block;padding:9px var(--s3);border-radius:var(--r-sm);
    color:var(--ink-2);font-size:13.5px;font-weight:600;transition:all var(--fast);
  }
  .raillink:hover{background:var(--card-alt);color:var(--ink)}
  .raillink[aria-current="page"]{background:var(--accent-soft);color:var(--primary-dark)}
  html[data-theme="dark"] .raillink[aria-current="page"]{color:var(--accent)}
  #bottomnav{display:none!important}
  #main{padding:var(--s6);padding-bottom:var(--s8)}
}
@media(min-width:1024px){ #main{padding:var(--s8) var(--s6)} }

#bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  display:flex;justify-content:space-around;align-items:stretch;height:var(--nav-h);
  background:color-mix(in srgb,var(--card) 95%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#bottomnav a{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:12px;font-weight:600;text-align:center;
  border-top:2px solid transparent;transition:color var(--fast);padding:0 2px;
}
#bottomnav a[aria-current="page"]{color:var(--primary);border-top-color:var(--primary)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh1);
  transition:box-shadow var(--fast),border-color var(--fast)}
a.card,button.card{display:block;width:100%;text-align:start;color:inherit}
a.card:hover,button.card:hover{box-shadow:var(--sh2);border-color:var(--line-strong)}
.pad{padding:var(--s4)}
.grid{display:grid;gap:var(--s3)}
@media(min-width:720px){.grid.cols2{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;align-items:center;gap:var(--s2)}
.wrapf{flex-wrap:wrap}
.muted{color:var(--ink-3)} .dim{color:var(--ink-2)}
.small{font-size:12.5px} .tiny{font-size:11.5px}
.mt1{margin-top:var(--s1)}.mt2{margin-top:var(--s2)}.mt3{margin-top:var(--s3)}
.mt4{margin-top:var(--s4)}.mt5{margin-top:var(--s5)}.mt6{margin-top:var(--s6)}
.mb2{margin-bottom:var(--s2)}.mb3{margin-bottom:var(--s3)}.mb4{margin-bottom:var(--s4)}
.chip{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r-pill);
  background:var(--card-alt);border:1px solid var(--line);
  font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;
}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.serious{background:var(--serious-bg);color:var(--serious);border-color:transparent}
.chip.critical{background:var(--critical-bg);color:var(--critical);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:#6A4E12;border-color:transparent}
html[data-theme="dark"] .chip.accent{color:var(--accent)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 18px;border-radius:var(--r-pill);font-weight:640;font-size:14px;
  background:var(--primary);color:#fff;border:1px solid transparent;
  transition:filter var(--fast);min-height:42px;
}
html[data-theme="dark"] .btn{color:#0D1411}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line-strong)}
.btn.sec:hover{background:var(--card-alt)}
.btn.ghost{background:transparent;color:var(--primary);border-color:transparent;padding:8px 10px}
.btn.ghost:hover{background:var(--card-alt)}
.btn.danger{background:var(--critical);color:#fff}
.btn.sm{padding:7px 14px;font-size:13px;min-height:36px}
.btn.block{width:100%}
.field{display:block;margin-bottom:var(--s3)}
.field > span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.input,select.input,textarea.input{
  width:100%;padding:10px 12px;border-radius:var(--r-sm);
  background:var(--card);border:1px solid var(--line-strong);color:var(--ink);
  transition:border-color var(--fast),box-shadow var(--fast);
}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
textarea.input{min-height:92px;resize:vertical}
.err{color:var(--critical);font-size:12px;margin-top:4px;display:block}
.notice{border-radius:var(--r-md);padding:var(--s3) var(--s4);border:1px solid transparent;font-size:13px;line-height:1.55}
.notice h4{font-size:13px;margin-bottom:4px}
.notice.info{background:var(--info-bg);color:var(--info);border-color:color-mix(in srgb,var(--info) 22%,transparent)}
.notice.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.notice.critical{background:var(--critical-bg);color:var(--critical);border-color:color-mix(in srgb,var(--critical) 26%,transparent)}
.notice.neutral{background:var(--card-alt);color:var(--ink-2);border-color:var(--line)}
.ph{border-radius:var(--r-sm);background:var(--card-alt);border:1px solid var(--line)}
.ph.thumb{width:88px;height:66px;flex:0 0 88px}
.ph.hero{width:100%;aspect-ratio:16/7}
.sep{height:1px;background:var(--line);margin:var(--s4) 0;border:0}
.list{display:flex;flex-direction:column;gap:var(--s3)}
.kv{display:flex;justify-content:space-between;gap:var(--s4);padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.empty{text-align:center;padding:var(--s8) var(--s4);color:var(--ink-3)}
.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--line);margin-bottom:var(--s4);overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:640;font-size:14px;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;transition:all var(--fast)}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.searchbar{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
.searchbar .input{flex:1}
.backlink{display:inline-block;color:var(--ink-2);font-weight:600;font-size:13.5px;margin-bottom:var(--s3)}
.backlink:hover{color:var(--ink)}
.price{font-size:18px;font-weight:700;letter-spacing:-.02em}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2)}
.qa a{
  padding:var(--s4);border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);
  color:var(--ink);font-size:14px;font-weight:640;box-shadow:var(--sh1);transition:all var(--fast);
}
.qa a:hover{border-color:var(--primary);color:var(--primary)}
.qa a .c{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);margin-top:3px}
.hstrip{display:flex;gap:var(--s3);overflow-x:auto;padding-bottom:var(--s2);scroll-snap-type:x mandatory}
.hstrip > *{flex:0 0 260px;scroll-snap-align:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4);box-shadow:var(--sh1)}
.stat .n{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
.stat .s{margin-top:var(--s2)}
.steps{display:flex;gap:var(--s1);margin-bottom:var(--s5);flex-wrap:wrap}
.steps .st{padding:6px 12px;border-radius:var(--r-pill);background:var(--card-alt);color:var(--ink-3);
  font-size:12.5px;font-weight:640;border:1px solid var(--line)}
.steps .st.on{background:var(--primary);color:#fff;border-color:transparent}
html[data-theme="dark"] .steps .st.on{color:#0D1411}
.steps .st.done{background:var(--good-bg);color:var(--good);border-color:transparent}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s2)}
.toggle{
  display:flex;align-items:center;gap:var(--s2);padding:11px var(--s3);
  border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--card);
  font-size:13.5px;font-weight:600;cursor:pointer;transition:all var(--fast);
}
.toggle:hover{border-color:var(--primary)}
.toggle[data-on="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--primary-dark)}
html[data-theme="dark"] .toggle[data-on="true"]{color:var(--accent)}
.toggle input{accent-color:var(--primary);width:16px;height:16px}
.md h1,.md h2,.md h3{margin:var(--s5) 0 var(--s2)}
.md h1{font-size:18px}.md h2{font-size:16px}.md h3{font-size:14.5px}
.md > :first-child{margin-top:0}
.md ul{margin:0 0 var(--s3);padding-left:var(--s5)}
.md li{margin-bottom:5px}
.md p{margin-bottom:var(--s3);color:var(--ink-2)}
dialog{border:none;border-radius:var(--r-lg);padding:0;max-width:440px;width:calc(100% - 32px);
  background:var(--card);color:var(--ink);box-shadow:var(--sh3)}
dialog::backdrop{background:rgba(10,16,13,.45)}
.dlg{padding:var(--s5)}
.dlg h3{margin-bottom:var(--s2)}
.dlgacts{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s5);flex-wrap:wrap}
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(16px);
  bottom:calc(var(--nav-h) + 14px);z-index:200;
  background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:var(--r-pill);
  font-size:13.5px;font-weight:600;box-shadow:var(--sh3);
  opacity:0;pointer-events:none;transition:opacity var(--base),transform var(--base);
  max-width:calc(100% - 32px);text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:600px){#toast{bottom:22px}}
.savebtn{padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line-strong);
  font-size:12px;font-weight:640;color:var(--ink-2);transition:all var(--fast);white-space:nowrap}
.savebtn:hover{border-color:var(--primary);color:var(--primary)}
.savebtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--primary-dark)}
html[data-theme="dark"] .savebtn.on{color:var(--accent)}
.maparea{border-radius:var(--r-md);border:1px solid var(--line);height:150px;background:var(--card-alt);
  display:grid;place-items:center;text-align:center;padding:var(--s4);color:var(--ink-3)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="demoBanner"></div>
<header id="appbar">
  <a class="brand" href="#/home" id="brandName">MongolUSA Hub</a>
  <span class="spacer"></span>
  <div class="langtoggle" role="group" aria-label="Language">
    <button id="langMn" onclick="setLang('mn')">МН</button>
    <button id="langEn" onclick="setLang('en')">EN</button>
  </div>
  <button class="txtbtn" id="themeBtn" onclick="toggleTheme()"></button>
</header>
<div id="citybar"></div>
<div id="layout">
  <nav id="rail" aria-label="Primary"></nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<nav id="bottomnav" aria-label="Primary"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><div class="dlg" id="modalBody"></div></dialog>

s":"verified","isDemo":true},{"id":"demo-d7","ownerUid":"demo-user-2","status":"approved","createdAt":"2024-12-25T12:00:00.000Z","updatedAt":"2026-03-20T12:00:00.000Z","displayName":"T. Munkh-Erdene — Education Consultant","category":"eduConsultant","languages":["mn","en"],"city":"Denver","state":"CO","licenseJurisdiction":"Colorado","licenseNumberMasked":"••••1104","verificationSource":"NACAC membership","verifiedAt":"2025-04-24T12:00:00.000Z","verificationExpiresAt":"2026-04-19T12:00:00.000Z","disclaimer":"Educational guidance only; outcomes are not guaranteed.","verificationStatus":"expired","isDemo":true}],"guides":[{"id":"demo-g1","ownerUid":"demo-staff-1","status":"approved","createdAt":"2026-05-19T12:00:00.000Z","updatedAt":"2026-08-05T12:00:00.000Z","title":"Жолооны үнэмлэх авах (Иллинойс)","body":"# Жолооны үнэмлэх авах алхамууд\n\nИллинойс мужид жолооны үнэмлэх (Driver's License) авахад дараах алхмуудыг дагана.\n\n## 1. Бичиг баримтаа бүрдүүлэх\n\n- Паспорт эсвэл виз, I-94 зэрэг хууль ёсны байдлын нотолгоо\n- SSN эсвэл SSN олгогдохгүйг нотлох бичиг (TVDL-д)\n- Оршин суугаа хаягийн нотолгоо 2 ширхэг (түрээсийн гэрээ, банкны хуулга гэх мэт)\n\n## 2. Бичгийн шалгалт\n\nDMV (Secretary of State) салбар дээр очиж бичгийн шалгалт өгнө. Rules of the Road номыг урьдчилан уншаарай — монгол хэл дээрх хураангуй манай нийтлэлд бий.\n\n## 3. Жолоодлогын шалгалт\n\nӨөрийн эсвэл багшийн машинаар шалгалт өгнө. Даатгал, бүртгэл хүчинтэй байх ёстой.\n\n## Зөвлөгөө\n\n- Цаг авахдаа онлайнаар урьдчилан захиалбал дараалал бага.\n- Хэрэв виз, статусын хугацаа 12 сараас бага бол түр үнэмлэх олгогдоно.\n","locale":"mn-Cyrl","sourceUrls":["https://www.ilsos.gov/departments/drivers/drivers_license/home.html"],"jurisdiction":"Illinois","lastReviewedAt":"2026-08-05T12:00:00.000Z","reviewer":"MongolUSA Hub editorial (demo)","disclaimer":"Мэдээлэл лавлагааны зориулалттай бөгөөд хууль зүйн зөвлөгөө биш. Албан ёсны шаардлагыг DMV-ээс шалгана уу.","version":3,"versionHistory":[{"version":3,"changedAt":"2026-08-05T12:00:00.000Z","changedBy":"demo-staff-1","note":"REAL ID шинэчлэл нэмэв"}],"isDemo":true},{"id":"demo-g2","ownerUid":"demo-staff-1","status":"approved","createdAt":"2026-04-19T12:00:00.000Z","updatedAt":"2026-07-18T12:00:00.000Z","title":"Татварын эхний алхмууд: SSN, ITIN, W-2","body":"# Татварын үндсэн ойлголтууд\n\nАНУ-д ажиллаж буй хүн бүр жил бүр татварын тайлан (tax return) гаргадаг.\n\n## SSN ба ITIN\n\n- SSN — ажиллах эрхтэй хүмүүст олгогдоно.\n- ITIN — SSN авах боломжгүй ч татвар тайлагнах шаардлагатай хүмүүст IRS-ээс олгодог дугаар.\n\n## Ажил олгогчоос авах баримтууд\n\n- W-2 — цалингийн ажилтанд 1-р сард ирнэ.\n- 1099 — гэрээт ажилтанд (contractor) ирнэ. 1099-өөр ажиллаж байгаа бол татвараа өөрөө урьдчилан тооцох хэрэгтэй.\n\n## Тайлан гаргах\n\n- Free File — орлого багатай бол IRS-ийн үнэгүй систем ашиглаж болно.\n- Монгол хэлтэй CPA-тай холбогдохыг хүсвэл манай лавлах (Directory) хэсгээс хайгаарай.\n\n## Анхааруулга\n\nТатварын тайланг хуурамчаар гаргах нь ноцтой хариуцлага хүлээлгэдэг. Эргэлзсэн зүйл байвал мэргэжилтнээс асуугаарай.\n","locale":"mn-Cyrl","sourceUrls":["https://www.irs.gov/individuals/individual-taxpayer-identification-number","https://www.irs.gov/filing/free-file-do-your-federal-taxes-for-free"],"jurisdiction":"Federal (US)","lastReviewedAt":"2026-07-18T12:00:00.000Z","reviewer":"MongolUSA Hub editorial (demo)","disclaimer":"Энэ гарын авлага нь татварын мэргэжлийн зөвлөгөө биш. Таны нөхцөл байдалд тохирсон зөвлөгөөг CPA-аас аваарай.","version":2,"versionHistory":[{"version":2,"changedAt":"2026-07-18T12:00:00.000Z","changedBy":"demo-staff-1","note":"2026 оны хязгаарууд шинэчлэгдэв"}],"isDemo":true},{"id":"demo-g3","ownerUid":"demo-staff-1","status":"approved","createdAt":"2026-06-18T12:00:00.000Z","updatedAt":"2026-08-10T12:00:00.000Z","title":"Хүүхдээ улсын сургуульд бүртгүүлэх","body":"# Улсын сургуульд бүртгүүлэх\n\nАНУ-д бүх хүүхэд иммиграцийн статусаас үл хамааран улсын сургуульд үнэгүй суралцах эрхтэй.\n\n## Шаардлагатай бичиг баримт\n\n- Хүүхдийн төрсний гэрчилгээ (орчуулгатай бол сайн)\n- Вакцины бүртгэл — муж бүр өөр шаардлагатай тул сургуулиасаа асуугаарай\n- Оршин суугаа хаягийн нотолгоо\n\n## ESL / EL хөтөлбөр\n\nАнгли хэл нь төрөлх бус хүүхдүүдэд зориулсан нэмэлт хэлний дэмжлэг (EL) ихэнх сургуульд бий. Бүртгэлийн үеэр хүсэлт гаргаарай.\n\n## Зөвлөгөө\n\n- Сургуулийн дүүрэг (school district) хаягаас хамаардаг тул байр хайхдаа дүүргээ шалгаарай.\n- Үнэгүй болон хөнгөлөлттэй хоолны хөтөлбөрт бүртгүүлж болно.\n","locale":"mn-Cyrl","sourceUrls":["https://www2.ed.gov/about/overview/focus/rights.html"],"jurisdiction":"Federal (US)","lastReviewedAt":"2026-08-10T12:00:00.000Z","reviewer":"MongolUSA Hub editorial (demo)","disclaimer":"Сургуулийн бүртгэлийн журам муж, дүүрэг бүрд өөр байдаг. Эцсийн шаардлагыг өөрийн дүүргээс лавлана уу.","version":1,"versionHistory":[],"isDemo":true}],"alerts":[{"id":"demo-a1","ownerUid":"demo-staff-1","status":"approved","createdAt":"2026-08-17T06:00:00.000Z","updatedAt":"2026-08-17T06:00:00.000Z","type":"weather","title":"Үерийн аюулын мэдэгдэл — Chicago орчим","body":"Үндэсний цаг уурын алба (NWS) Cook County орчимд аадар бороо, үерийн аюулын мэдэгдэл гаргалаа. Доод давхарт амьдардаг бол эд зүйлсээ өндөрлөж, зам үерлэсэн үед машинаар бүү гарна уу.","areaStates":["IL"],"expiresAt":"2026-08-19T12:00:00.000Z","trustedSource":true,"sourceOrg":"National Weather Service (via community mods)","approvedBy":"demo-staff-1","corrections":[],"isDemo":true},{"id":"demo-a2","ownerUid":"demo-staff-1","status":"approved","createdAt":"2026-08-14T12:00:00.000Z","updatedAt":"2026-08-14T12:00:00.000Z","type":"consular","title":"Консулын явуулын үйлчилгээ — Colorado бүртгэл эхэллээ","body":"Монгол Улсын ЭСЯ Денвер хотод явуулын консулын үйлчилгээ үзүүлнэ. Гадаад паспорт шинэчлэх, нотариат, тодорхойлолтын үйлчилгээнд урьдчилан бүртгүүлнэ үү. Дэлгэрэнгүйг Events хэсгээс харна уу.","areaStates":["CO","UT","WY"],"expiresAt":"2026-09-16T12:00:00.000Z","trust /* ===================== state ===================== */
function loadPrefs(){
  try{
    const raw = localStorage.getItem('mh_prefs');
    if (raw){
      const p = JSON.parse(raw);
      return {city:p.city ?? null, cats:new Set(p.cats || CATS.map(c=>c.key)), configured:!!p.configured};
    }
  }catch(e){}
  return {city:null, cats:new Set(CATS.map(c=>c.key)), configured:false};
}
function savePrefs(){
  localStorage.setItem('mh_prefs', JSON.stringify({
    city:state.prefs.city, cats:[...state.prefs.cats], configured:state.prefs.configured}));
}
const state = {
  lang: localStorage.getItem('mh_lang') || 'mn',
  theme: localStorage.getItem('mh_theme') || 'light',
  signedIn:false, role:'member',
  saved:new Set(),
  reports:DATA.reports.slice(),
  decisions:{}, imageStates:{},
  audit:DATA.auditLogs.slice(),
  filters:null, draft:null,
  prefs: loadPrefs(),
  ignoreCity:false,   // set while browsing "all cities" from an empty result
};
const catOn = k => state.prefs.cats.has(k);
const myCity = () => state.ignoreCity ? null : state.prefs.city;
const myState = () => { const c = CITIES.find(x=>x.city===myCity()); return c ? c.state : null; };
const myStateName = () => { const c = CITIES.find(x=>x.city===myCity()); return c ? c.stateName : null; };

/* ===================== i18n ===================== */
function t(key, vars){
  const e = STR[key];
  let s = e ? (e[state.lang] || e.en || key) : key;
  if (vars) for (const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const LOC = () => state.lang === 'mn' ? 'mn-MN' : 'en-US';
function money(c){ return c==null?'':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(c/100); }
function moneyPrecise(c){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(c/100); }
function fdate(iso, opts){
  if (!iso) return '';
  try{ return new Date(iso).toLocaleDateString(LOC(), opts||{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return String(iso).slice(0,10); }
}
function ftime(iso, tz){
  if (!iso) return '';
  try{ return new Date(iso).toLocaleString(LOC(),{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:tz||undefined}); }
  catch(e){ return fdate(iso); }
}

/* ===================== theme / lang ===================== */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = state.theme==='dark' ? t('themeLight') : t('themeDark');
}
function toggleTheme(){
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  localStorage.setItem('mh_theme', state.theme); applyTheme(); render();
}
function setLang(l){
  state.lang = l; localStorage.setItem('mh_lang', l);
  document.documentElement.lang = l==='mn' ? 'mn' : 'en';
  applyTheme(); render();
}

/* ===================== data ===================== */
const allListings = () => DATA.housing.concat(DATA.marketplace);
function byId(id){
  return allListings().find(x=>x.id===id) || DATA.jobs.find(x=>x.id===id)
    || DATA.events.find(x=>x.id===id) || DATA.directory.find(x=>x.id===id)
    || DATA.guides.find(x=>x.id===id) || DATA.alerts.find(x=>x.id===id);
}
function effStatus(i){ const d = state.decisions[i.id]; return d ? d.status : i.status; }
const isPublic = i => effStatus(i)==='approved';

/* City scoping. Remote jobs are location-independent, so they always pass. */
function inMyCity(item){
  const c = myCity();
  if (!c) return true;
  if (item.remote === true) return true;
  return item.city === c;
}
function publicHousing(){ return DATA.housing.filter(x=>isPublic(x) && inMyCity(x)); }
function publicMarket(){ return DATA.marketplace.filter(x=>isPublic(x) && inMyCity(x)); }
function publicJobs(){ return DATA.jobs.filter(x=>isPublic(x) && inMyCity(x)); }
function publicEvents(){
  return DATA.events.filter(x=>isPublic(x) && inMyCity(x))
    .slice().sort((a,b)=>new Date(a.startAt)-new Date(b.startAt));
}
function publicDirectory(){
  return DATA.directory.filter(d=>isPublic(d) && d.verificationStatus==='verified' && inMyCity(d));
}
/* Guides are federal or state-scoped, never city-scoped. */
function publicGuides(){
  const sn = myStateName();
  return DATA.guides.filter(g => isPublic(g) &&
    (!sn || !g.jurisdiction || /federal/i.test(g.jurisdiction) || g.jurisdiction === sn));
}
/* Notices are targeted by state. */
function activeNotices(){
  const now = new Date('2026-08-17T12:00:00Z');
  const st = myState();
  return DATA.alerts.filter(a => isPublic(a) && new Date(a.expiresAt) > now &&
    (!st || (a.areaStates||[]).includes(st)));
}
function pendingQueue(){ return allListings().filter(x=>effStatus(x)==='pending'); }

function statusChip(st){
  const m = {approved:['good','statusApproved'],pending:['warn','statusPending'],rejected:['critical','statusRejected'],
    changesRequested:['serious','statusChangesRequested'],draft:['info','statusDraft'],
    archived:['info','statusArchived'],expired:['info','statusExpired']}[st] || ['info','statusDraft'];
  return '<span class="chip '+m[0]+'">'+esc(t(m[1]))+'</span>';
}
const SUBCAT={apartment:'subcatApartment',room:'subcatRoom',sublease:'subcatSublease',shared:'subcatShared',
  roommate:'subcatRoommate',goods:'subcatGoods',car:'subcatCar',furniture:'subcatFurniture',
  electronics:'subcatElectronics',cargo:'subcatCargo',exchange:'subcatExchange'};
const EMPTYPE={fullTime:'employmentFullTime',partTime:'employmentPartTime',temporary:'employmentTemporary',
  contract:'employmentContract',internship:'employmentInternship',volunteer:'employmentVolunteer'};
const EVCAT={naadam:'eventCatNaadam',school:'eventCatSchool',church:'eventCatChurch',sports:'eventCatSports',
  culture:'eventCatCulture',networking:'eventCatNetworking',workshop:'eventCatWorkshop',
  consular:'eventCatConsular',other:'eventCatOther'};
const DIRCAT={immigrationAttorney:'dirCatImmigrationAttorney',attorney:'dirCatAttorney',cpa:'dirCatCpa',
  translator:'dirCatTranslator',insurance:'dirCatInsurance',realEstate:'dirCatRealEstate',
  eduConsultant:'dirCatEduConsultant',healthcare:'dirCatHealthcare'};
const ALTYPE={missingPerson:'alertTypeMissingPerson',weather:'alertTypeWeather',safety:'alertTypeSafety',
  fundraisingRef:'alertTypeFundraising',assistance:'alertTypeAssistance',consular:'alertTypeConsular'};

  'reportReasonHarassment','reportReasonOther'];
const US_STATES=['AZ','CA','CO','DC','GA','IL','IN','MA','MD','MI','MN','NC','NJ','NV','NY','OH','OR','PA','TX','UT','VA','WA'];

function compText(c){
  if (!c) return '';
  const per = c.period==='hour'?'compPerHour':c.period==='year'?'compPerYear':'compFlat';
  const lo = c.period==='hour'?moneyPrecise(c.minCents):money(c.minCents);
  const hi = c.maxCents!=null ? (c.period==='hour'?moneyPrecise(c.maxCents):money(c.maxCents)) : null;
  return (hi?lo+' – '+hi:lo)+' '+t(per);
}

/* ===================== toast / modal ===================== */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'),2400);
}
function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modal').showModal(); }
function closeModal(){ const d=document.getElementById('modal'); if (d.open) d.close(); }

/* ===================== preferences ===================== */
function prefsEditor(){
  const cityOpts = '<option value="">'+esc(t('prefsAllCities'))+'</option>' +
    CITIES.map(c=>'<option value="'+esc(c.city)+'"'+(state.prefs.city===c.city?' selected':'')+'>'+
      esc(c.city)+', '+esc(c.state)+'</option>').join('');
  return ''+
  '<label class="field"><span>'+esc(t('prefsCity'))+'</span>'+
    '<select class="input" id="prefCity">'+cityOpts+'</select></label>'+
  '<div class="field"><span>'+esc(t('prefsCategories'))+'</span>'+
    '<div class="toggles">'+ CATS.map(c =>
      '<label class="toggle" data-on="'+catOn(c.key)+'">'+
        '<input type="checkbox" value="'+c.key+'" '+(catOn(c.key)?'checked':'')+
        ' onchange="this.closest(\'.toggle\').dataset.on=this.checked">'+
        '<span>'+esc(t(c.label))+'</span></label>').join('') +
    '</div></div>';
}
function openPrefs(){
  openModal(
    '<h3>'+esc(t('prefsTitle'))+'</h3>'+
    '<p class="dim small">'+esc(t('prefsIntroBody'))+'</p>'+
    '<div class="mt4">'+prefsEditor()+'</div>'+
    '<div class="dlgacts"><button class="btn sec" onclick="closeModal()">'+esc(t('actionCancel'))+'</button>'+
    '<button class="btn" onclick="applyPrefs()">'+esc(t('prefsSaveAction'))+'</button></div>');
}
function applyPrefs(){
  const city = document.getElementById('prefCity').value;
  const cats = Array.from(document.querySelectorAll('.toggles input:checked')).map(i=>i.value);
  if (!cats.length){ toast(t('prefsNoCategories')); return; }
  state.prefs.city = city || null;
  state.prefs.cats = new Set(cats);
  state.prefs.configured = true;
  state.ignoreCity = false;
  savePrefs(); closeModal(); toast(t('prefsSaved'));
  // If the screen we are on belongs to a category the user just switched off,
  // go home — but only navigate when that actually changes the hash, otherwise
  // no hashchange fires and the view would never repaint.
  const cat = currentCat();
  if (cat && !catOn(cat) && location.hash !== '#/home') location.hash = '#/home';
  else render();
}
function currentCat(){
  const h = location.hash||'';
  if (h.startsWith('#/explore/housing')||h.startsWith('#/listing')) return 'housing';
  if (h.startsWith('#/explore/jobs')||h.startsWith('#/job')) return 'jobs';
  if (h.startsWith('#/explore/market')) return 'market';
  if (h.startsWith('#/event')) return 'events';
  if (h.startsWith('#/directory')||h.startsWith('#/pro')) return 'directory';
  if (h.startsWith('#/guide')) return 'guides';
  if (h.startsWith('#/alert')) return 'notices';
  return null;
}
function showAllCities(){ state.ignoreCity = true; render(); toast(t('prefsViewAllCities')); }

/* ===================== actions ===================== */
function toggleSave(id, ev){
  if (ev){ ev.preventDefault(); ev.stopPropagation(); }
  if (!state.signedIn){ signInPrompt(); return; }
  if (state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
  render();
}
function signInPrompt(){
  openModal('<h3>'+esc(t('signInTitle'))+'</h3><p class="dim small">'+esc(t('demoSignInHint'))+'</p>'+
    '<div class="mt4"><button class="btn block" onclick="doSignIn(\'member\')">'+esc(t('actionSignIn'))+'</button></div>'+

    '<div class="dlgacts"><button class="btn ghost" onclick="closeModal()">'+esc(t('continueAsGuest'))+'</button></div>');

function decide(id, status){
  if (status==='approved'){ applyDecision(id,status,null,''); return; }
  const key = status==='rejected'?'adminRejectTitle':'adminRequestChangesTitle';
  openModal('<h3>'+esc(t(key))+'</h3>'+

function applyDecision(id,status,reason,note){
  const item = byId(id); if (!item) return;
  const before = effStatus(item);
  state.decisions[id] = {status,reason,note,at:new Date().toISOString()};
  state.audit.unshift({id:'log-'+Date.now(),
    action:'listing.'+(status==='approved'?'approve':status==='rejected'?'reject':'requestChanges'),
    actorUid:'demo-staff-1', targetPath:'listings/'+id, before:{status:before}, after:{status}, at:new Date().toISOString()});
  closeModal(); toast(t('adminDecisionSaved')); render();
}

/* ===================== navigation ===================== */
function navItems(){
  const items = [{href:'#/home', key:'navHome'}];
  if (catOn('housing')||catOn('jobs')||catOn('market')) items.push({href:exploreHref(), key:'navExplore'});
  if (catOn('events')) items.push({href:'#/events', key:'navEvents'});
  if (catOn('directory')) items.push({href:'#/directory', key:'navDirectory'});
  if (catOn('notices')) items.push({href:'#/alerts', key:'navAlerts'});
  if (catOn('guides')) items.push({href:'#/guides', key:'navGuides'});
  items.push({href:'#/profile', key:'navProfile'});
  return items;
}
function exploreHref(){
  if (catOn('housing')) return '#/explore/housing';
  if (catOn('jobs')) return '#/explore/jobs';
  return '#/explore/market';
}
function currentNavHref(){
  const h = location.hash||'#/home';
  if (h.startsWith('#/explore')||h.startsWith('#/listing')||h.startsWith('#/job')) return exploreHref();
  if (h.startsWith('#/event')) return '#/events';
  if (h.startsWith('#/directory')||h.startsWith('#/pro')) return '#/directory';
  if (h.startsWith('#/alert')) return '#/alerts';
  if (h.startsWith('#/guide')) return '#/guides';
  if (h.startsWith('#/profile')||h.startsWith('#/mylistings')) return '#/profile';
  if (h.startsWith('#/home')||h==='#/'||h==='') return '#/home';
  return '';
}
function renderNav(){
  const cur = currentNavHref();
  const items = navItems();
  const link = (n,cls) => '<a class="'+cls+'" href="'+n.href+'"'+(cur===n.href?' aria-current="page"':'')+'>'+esc(t(n.key))+'</a>';
  document.getElementById('rail').innerHTML =
    items.map(n=>link(n,'raillink')).join('') +
    (state.role==='moderator' ? link({href:'#/admin',key:'adminTitle'},'raillink') : '');
  // the bottom bar stays at five destinations; the rest live on the home screen
  document.getElementById('bottomnav').innerHTML = items.slice(0,5).map(n=>link(n,'')).join('');
}

  return {q:'',state:'',city:'',zip:'',min:'',max:'',sort:'sortNewest',bedrooms:'',furnished:false,utilities:false,empType:'',remote:false};
}
function screenExplore(tab){
  const map = {housing:'housing', jobs:'jobs', market:'market'};
  if (!map[tab] || !catOn(map[tab])){
    const first = ['housing','jobs','market'].find(catOn);
    if (!first) return '<h1>'+esc(t('exploreTitle'))+'</h1><div class="empty"><p>'+esc(t('prefsNoCategories'))+
      '</p><button class="btn sm mt3" onclick="openPrefs()">'+esc(t('prefsChange'))+'</button></div>';
    tab = first;
  }
  if (!state.filters) state.filters = defaultFilters();
  const f = state.filters;
  const tabs = [['housing','categoryHousing'],['jobs','categoryJobs'],['market','categoryMarketplace']]
    .filter(x=>catOn(x[0]));
  let items = tab==='jobs'?publicJobs():tab==='market'?publicMarket():publicHousing();
  const q = f.q.trim().toLowerCase();
  items = items.filter(it=>{
    if (q){
      const hay=(it.title+' '+it.description+' '+(it.city||'')+' '+(it.state||'')+' '+(it.zip||'')+' '+(it.employerName||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (f.state && it.state!==f.state) return false;
    if (f.city && !(it.city||'').toLowerCase().includes(f.city.toLowerCase())) return false;
    if (f.zip && (it.zip||'')!==f.zip) return false;
    if (tab==='jobs'){
      if (f.empType && it.employmentType!==f.empType) return false;
      if (f.remote && !it.remote) return false;
      const c=it.compensation||{};
      if (f.min!=='' && c.minCents!=null && c.minCents<Number(f.min)*100) return false;
      if (f.max!=='' && c.minCents!=null && c.minCents>Number(f.max)*100) return false;
    } else {
      if (f.min!=='' && it.priceCents<Number(f.min)*100) return false;
      if (f.max!=='' && it.priceCents>Number(f.max)*100) return false;
      if (tab==='housing' && it.housing){
        if (f.bedrooms && it.housing.bedrooms<Number(f.bedrooms)) return false;
        if (f.furnished && !it.housing.furnished) return false;
        if (f.utilities && !it.housing.utilitiesIncluded) return false;
      }
    }
    return true;
  });
  const price = it => tab==='jobs'?((it.compensation||{}).minCents||0):it.priceCents;
  if (f.sort==='sortPriceAsc') items.sort((a,b)=>price(a)-price(b));
  else if (f.sort==='sortPriceDesc') items.sort((a,b)=>price(b)-price(a));
  else items.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  const card = tab==='jobs'?jobCard:listingCard;
  return ''+
  '<h1>'+esc(t('exploreTitle'))+'</h1>'+
  '<div class="tabs mt4" role="tablist">'+tabs.map(x=>
    '<button role="tab" aria-selected="'+(tab===x[0])+'" onclick="location.hash=\'#/explore/'+x[0]+'\'">'+esc(t(x[1]))+'</button>').join('')+'</div>'+
  '<div class="searchbar">'+
    '<input class="input" id="fq" placeholder="'+esc(t('searchHint'))+'" value="'+esc(f.q)+'" oninput="onFilter(\'q\',this.value)">'+
    '<button class="btn sec" onclick="toggleFilters()">'+esc(t('filtersTitle'))+'</button></div>'+
  '<div class="card pad mb4" id="filterPanel" style="display:none">'+
    '<div class="grid cols2">'+
      '<label class="field"><span>'+esc(t('filterState'))+'</span><select class="input" onchange="onFilter(\'state\',this.value)">'+
        '<option value="">'+esc(t('filterAnyState'))+'</option>'+
        US_STATES.map(s=>'<option value="'+s+'"'+(f.state===s?' selected':'')+'>'+s+'</option>').join('')+'</select></label>'+
      '<label class="field"><span>'+esc(t('filterCity'))+'</span><input class="input" value="'+esc(f.city)+'" oninput="onFilter(\'city\',this.value)"></label>'+
      '<label class="field"><span>'+esc(t('filterPriceRange'))+' (min $)</span><input class="input" type="number" value="'+esc(f.min)+'" oninput="onFilter(\'min\',this.value)"></label>'+
      '<label class="field"><span>'+esc(t('filterPriceRange'))+' (max $)</span><input class="input" type="number" value="'+esc(f.max)+'" oninput="onFilter(\'max\',this.value)"></label>'+
      (tab==='housing'?
        '<label class="field"><span>'+esc(t('filterBedroomsMin'))+'</span><input class="input" type="number" min="0" value="'+esc(f.bedrooms)+'" oninput="onFilter(\'bedrooms\',this.value)"></label>'+
        '<div class="field"><span>'+esc(t('filterHousingSection'))+'</span>'+
          '<label class="row small"><input type="checkbox" '+(f.furnished?'checked':'')+' onchange="onFilter(\'furnished\',this.checked)"> '+esc(t('filterFurnished'))+'</label>'+
          '<label class="row small mt1"><input type="checkbox" '+(f.utilities?'checked':'')+' onchange="onFilter(\'utilities\',this.checked)"> '+esc(t('filterUtilitiesIncluded'))+'</label></div>':'')+
      (tab==='jobs'?
        '<label class="field"><span>'+esc(t('filterEmploymentType'))+'</span><select class="input" onchange="onFilter(\'empType\',this.value)">'+
          '<option value="">'+esc(t('filterAny'))+'</option>'+
          Object.keys(EMPTYPE).map(k=>'<option value="'+k+'"'+(f.empType===k?' selected':'')+'>'+esc(t(EMPTYPE[k]))+'</option>').join('')+'</select></label>'+
        '<div class="field"><span>&nbsp;</span><label class="row small"><input type="checkbox" '+(f.remote?'checked':'')+' onchange="onFilter(\'remote\',this.checked)"> '+esc(t('filterRemoteOnly'))+'</label></div>':'')+
      '<label class="field"><span>'+esc(t('filterSort'))+'</span><select class="input" onchange="onFilter(\'sort\',this.value)">'+
        ['sortNewest','sortPriceAsc','sortPriceDesc'].map(s=>'<option value="'+s+'"'+(f.sort===s?' selected':'')+'>'+esc(t(s))+'</option>').join('')+'</select></label>'+
    '</div><button class="btn sec sm" onclick="clearFilters()">'+esc(t('actionClearFilters'))+'</button></div>'+
  '<div class="row mb3"><span class="muted small">'+esc(t('resultsCount',{count:items.length}))+'</span></div>'+
  (items.length ? '<div class="grid cols2">'+items.map(card).join('')+'</div>' : emptyForCity());
}

function mdToHtml(md){
  const lines=String(md||'').split('\n');
  let out='',inList=false;
  const close=()=>{ if(inList){out+='</ul>';inList=false;} };
  for (const raw of lines){
    const line=raw.trimEnd();
    if (/^###\s+/.test(line)){close();out+='<h3>'+esc(line.replace(/^###\s+/,''))+'</h3>';}
    else if (/^##\s+/.test(line)){close();out+='<h2>'+esc(line.replace(/^##\s+/,''))+'</h2>';}
    else if (/^#\s+/.test(line)){close();out+='<h1>'+esc(line.replace(/^#\s+/,''))+'</h1>';}
    else if (/^[-*]\s+/.test(line)){ if(!inList){out+='<ul>';inList=true;} out+='<li>'+esc(line.replace(/^[-*]\s+/,''))+'</li>'; }
    else if (!line.trim()){close();}
    else {close();out+='<p>'+esc(line)+'</p>';}
  }
  close(); return out;
}

function draftSet(k,v){
  state.draft[k]=v;
  if (!['title','description','price','city','zip'].includes(k)) render();
}
function draftStep(dir){
  const d=state.draft;
  if (dir>0 && !validateStep()){ render(); return; }
  d.step=Math.max(0,Math.min(3,d.step+dir)); d.errors={}; render();
}
function validateStep(){
  const d=state.draft; d.errors={};
  if (d.step===0){
    if (!d.title.trim()) d.errors.title=t('validationRequired');
    else if (d.title.trim().length<8) d.errors.title=t('validationTitleLength');
    else {
      const hit=BAD_WORDS.find(w=>d.title.toLowerCase().includes(w));
      if (hit){
        openModal('<h3>'+esc(t('fairHousingTitle'))+'</h3><p class="small dim mt2">'+esc(t('fairHousingNotice'))+'</p>'+
          '<div class="notice critical mt3">'+esc(hit)+'</div>'+
          '<div class="dlgacts"><button class="btn" onclick="closeModal()">'+esc(t('actionDone'))+'</button></div>');
        d.errors.title=t('validationRequired');
      }
    }
  } else if (d.step===1){
    if (!d.description.trim()) d.errors.description=t('validationRequired');
    else if (d.description.trim().length<20) d.errors.description=t('validationDescriptionLength');
    if (!d.price) d.errors.price=t('validationRequired');
    else if (isNaN(Number(d.price))||Number(d.price)<=0) d.errors.price=t('validationPrice');
  } else if (d.step===2){
    if (!d.city.trim()) d.errors.city=t('validationRequired');
    if (!d.state) d.errors.state=t('validationStateRequired');
    if (d.zip && !/^\d{5}$/.test(d.zip)) d.errors.zip=t('validationZip');
  }
  return Object.keys(d.errors).length===0;
}

        '<div style="flex:1;min-width:0"><h3>'+esc(l.title)+'</h3>'+
        '<div class="dim small mt1">'+esc(l.city)+', '+esc(l.state)+' · '+money(l.priceCents)+' · '+esc(t(SUBCAT[l.subcategory]||l.subcategory))+'</div></div>'+
        statusChip('pending')+'</div>'+
        '<p class="small dim mt3">'+esc(l.description.slice(0,180))+(l.description.length>180?'…':'')+'</p>'+
        '<div class="row wrapf mt3" style="gap:var(--s2)">'+
          '<button class="btn sm" onclick="decide(\''+l.id+'\',\'approved\')">'+esc(t('actionApprove'))+'</button>'+
          '<button class="btn sec sm" onclick="decide(\''+l.id+'\',\'changesRequested\')">'+esc(t('actionRequestChanges'))+'</button>'+
          '<button class="btn danger sm" onclick="decide(\''+l.id+'\',\'rejected\')">'+esc(t('actionReject'))+'</button>'+
        '</div></div>').join('')
      :'<div class="empty"><p>'+esc(t('adminQueueEmpty'))+'</p></div>';
  } else if (tab==='images'){
    body=imgs.length?imgs.map(i=>{
      const v=i.visionResult||{}; const risky=['LIKELY','VERY_LIKELY'];
      const flagged=Object.values(v).some(x=>risky.includes(x));
      return '<div class="card pad"><div class="row" style="gap:var(--s3)"><div class="ph thumb"></div>'+
        '<div style="flex:1;min-width:0"><div class="tiny muted">'+esc(i.targetPath)+'</div>'+
        '<div class="row wrapf mt2" style="gap:6px">'+Object.keys(v).map(k=>
          '<span class="chip '+(risky.includes(v[k])?'critical':'good')+'">'+esc(k)+': '+esc(v[k])+'</span>').join('')+'</div>'+
        (flagged?'<div class="notice critical mt3">Flagged by Cloud Vision SafeSearch — held for human review, never auto-published.</div>':'')+
        '<div class="row wrapf mt3" style="gap:var(--s2)">'+
          '<button class="btn sm" onclick="setImageState(\''+i.id+'\',\'approved\')">'+esc(t('actionApprove'))+'</button>'+
          '<button class="btn danger sm" onclick="setImageState(\''+i.id+'\',\'rejected\')">'+esc(t('actionReject'))+'</button>'+
        '</div></div></div></div>';
    }).join(''):'<div class="empty"><p>'+esc(t('adminQueueEmpty'))+'</p></div>';
  } else if (tab==='reports'){
    body=state.reports.length?state.reports.map(r=>
      '<div class="card pad"><span class="chip critical">'+esc(r.reasonCode)+'</span>'+
      '<div class="small mt2">'+esc(r.note||'—')+'</div>'+
      '<div class="tiny muted mt2">'+esc(r.targetPath)+' · '+esc(fdate(r.createdAt))+'</div>'+
      '<div class="row wrapf mt3" style="gap:var(--s2)">'+
        '<button class="btn sm" onclick="resolveReport(\''+r.id+'\')">'+esc(t('actionResolve'))+'</button></div></div>').join('')
      :'<div class="empty"><p>'+esc(t('adminQueueEmpty'))+'</p></div>';
  } else {
    body='<div class="card pad">'+state.audit.map(a=>
      '<div class="kv"><span><b>'+esc(a.action)+'</b><div class="tiny muted">'+esc(a.targetPath)+'</div></span>'+
      '<span class="tiny muted" style="text-align:end">'+esc(a.actorUid)+'<br>'+esc(fdate(a.at,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}))+'</span></div>').join('')+'</div>'+
      '<p class="tiny muted mt3">Audit events are immutable and written server-side by Cloud Functions; clients can never write this collection.</p>';
  }
  return '<h1>'+esc(t('adminTitle'))+'</h1>'+
    '<div class="stats mt4">'+queueStat(pend.length,'adminStatPending')+queueStat(imgs.length,'adminStatImages')+
      queueStat(state.reports.length,'adminStatReports')+doneStat(decided,'adminStatDecidedToday')+'</div>'+
    '<div class="tabs mt5" role="tablist">'+tabs.map(x=>
      '<button role="tab" aria-selected="'+(tab===x[0])+'" onclick="location.hash=\'#/admin/'+x[0]+'\'">'+esc(t(x[1]))+' ('+x[2]+')</button>').join('')+'</div>'+
    '<div class="list">'+body+'</div>';
}
function notFound(){
  return '<div class="empty"><h3>'+esc(t('errorNotFound'))+'</h3>'+
    '<div class="mt4"><a class="btn" href="#/home">'+esc(t('navHome'))+'</a></div></div>';
}

/* ===================== router ===================== */
function route(){
  const parts=(location.hash||'#/home').slice(2).split('/');
  switch(parts[0]){
    case '': case 'home': return screenHome();
    case 'setup': return screenSetup();
    case 'explore': return screenExplore(parts[1]||'housing');
    case 'listing': return screenListing(parts[1]);
    case 'job': return screenJob(parts[1]);
    case 'events': return catOn('events')?screenEvents():screenHome();
    case 'event': return screenEvent(parts[1]);
    case 'directory': return catOn('directory')?screenDirectory():screenHome();
    case 'pro': return screenPro(parts[1]);
    case 'guides': return catOn('guides')?screenGuides():screenHome();
    case 'guide': return screenGuide(parts[1]);
    case 'alerts': return catOn('notices')?screenNotices():screenHome();
    case 'alert': return screenNotice(parts[1]);
    case 'saved': return screenSaved();
    case 'profile': return screenProfile();
    case 'create': return screenCreate();
    case 'admin': return screenAdmin();
    default: return notFound();
  }
}
function render(){
  document.getElementById('demoBanner').textContent = t('demoBannerText');
  document.getElementById('langMn').setAttribute('aria-pressed', String(state.lang==='mn'));
  document.getElementById('langEn').setAttribute('aria-pressed', String(state.lang==='en'));
  document.getElementById('brandName').textContent = t('appTitle');
  document.getElementById('citybar').style.display = state.prefs.configured ? 'flex' : 'none';
  if (state.prefs.configured) renderCityBar();
  renderNav();
  document.getElementById('view').innerHTML = route();
}
window.addEventListener('hashchange', ()=>{ state.ignoreCity=false; render(); window.scrollTo(0,0); });
document.documentElement.lang = state.lang==='mn' ? 'mn' : 'en';
applyTheme();
render();
</script>
</body>
</html>
